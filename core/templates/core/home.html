{% load static %}
<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PKanoon Tutor</title>

  <style>
    body{
      margin:0;
      font-family:'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#FDCF72;
      color:#111;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:16px;
    }

    /* ===== LOGO ===== */
    .logo{
      display:flex;
      justify-content:center;
      margin:12px 0 20px;
    }

    .logo img{
      max-height:260px;
      width:auto;
    }

    /* ===== IMAGE GRID ===== */
    .grid{
      display:grid;
      grid-template-columns:repeat(2, 1fr); /* 📱 mobile: 2x4 */
      gap:12px;
      margin-bottom:28px;
    }

    .tile{
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(0,0,0,.08);
      aspect-ratio:1/1;
    }

    .tile img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* 🖥 desktop / tablet */
    @media (min-width: 768px){
      .grid{
        grid-template-columns:repeat(4, 1fr); /* 4x2 */
      }
      .logo img{
        max-height:320px;
      }
    }

    /* ===== BUTTONS ===== */
    .actions{
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:center;
      margin-bottom:8px;
    }

    .btn{
      width:100%;
      max-width:360px;
      padding:16px 22px;
      border-radius:20px;
      font-size:18px;
      font-weight:700;
      text-decoration:none;
      text-align:center;
      letter-spacing:.3px;
      box-shadow:0 10px 26px rgba(0,0,0,.15);
      transition:transform .15s ease, box-shadow .15s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 34px rgba(0,0,0,.22);
    }

    .btn-student{
      color:#fff;
      background:linear-gradient(135deg,#22c55e,#16a34a);
    }

    .btn-tutor{
      color:#fff;
      background:linear-gradient(135deg,#6366f1,#4f46e5);
    }

    .btn-check{
      color:#fff;
      background:linear-gradient(135deg,#0ea5e9,#0369a1);
    }

    .hint{
      font-size:13px;
      color:#333;
      text-align:center;
      margin-top:10px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- LOGO -->
    <div class="logo">
      <img src="{% static 'core/logo.png' %}" alt="PKanoon Tutor">
    </div>

    <!-- IMAGE GRID (8 images) -->
    <div class="grid">
      {% for i in "12345678" %}
        <div class="tile">
          <img src="{% static 'core/home/'|add:i|add:'.jpg' %}" alt="home {{ i }}">
        </div>
      {% endfor %}
    </div>

    <!-- ACTION BUTTONS -->
    <div class="actions">
      <a class="btn btn-check" href="/student-id-list/">🔍 ตรวจสอบ Username ของนักเรียน</a>
      <a class="btn btn-student" href="/student-portal/">👨‍👩‍👧 Student Portal</a>
      <a class="btn btn-tutor" href="/admin/login/?next=/admin/">🧑‍🏫 Tutor Portal</a>
          </div>

    <div class="hint">
      หากเข้าระบบไม่ได้ กรุณาติดต่อพี่ขนุนติวเตอร์ Line : @pkanoontutor
    </div>

  </div>
</body>
</html>

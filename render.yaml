services:
  - type: web
    name: pkanoontutor
    env: python
    pythonVersion: 3.12.8
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate
    # Sheet PDFs are uploaded without a size cap, and a worker counts as
    # "busy" for the whole time it is reading the request body -- on
    # gunicorn's default 30s timeout a large upload got the worker killed
    # mid-transfer and the browser saw a 502, so the timeout is raised well
    # past any realistic upload. That alone wasn't enough though: gunicorn
    # also defaults to a single worker, so with only one in-flight slot, one
    # big upload blocked EVERY other request on the whole site for its
    # entire duration -- including any other upload dropped at the same
    # time on the sheet-inventory continuous-upload page, which fires
    # several independent uploads at once by design. A request stuck
    # waiting behind that one busy worker can look like a 500/timeout or
    # simply never complete from the browser's side. --workers 2 --threads
    # 4 gives 8 concurrent request slots (threads share a worker's memory,
    # so this is far cheaper than 8 separate worker processes) so one slow
    # upload no longer starves everything else.
    startCommand: gunicorn config.wsgi:application --timeout 1800 --graceful-timeout 60 --workers 2 --worker-class gthread --threads 4

  # Full-system Excel export emailed to pkanoontutor@gmail.com.
  # Schedules are UTC; the site runs on Asia/Bangkok (UTC+7), so 23:59 local
  # is 16:59 UTC the same day.
  #   Sunday 23:59 ICT -> "59 16 * * 0"
  #   Friday 23:59 ICT -> "59 16 * * 5"
  - type: cron
    name: pkanoontutor-export-sunday
    env: python
    pythonVersion: 3.12.8
    schedule: "59 16 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py email_full_export

  - type: cron
    name: pkanoontutor-export-friday
    env: python
    pythonVersion: 3.12.8
    schedule: "59 16 * * 5"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py email_full_export

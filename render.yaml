services:
  - type: web
    name: pkanoontutor
    env: python
    pythonVersion: 3.12.8
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate
    # Sheet PDFs are uploaded without a size cap, and a sync worker counts
    # as "busy" for the whole time it is reading the request body -- on
    # gunicorn's default 30s timeout a large upload gets the worker killed
    # mid-transfer and the browser sees a 502. Allow long uploads instead.
    startCommand: gunicorn config.wsgi:application --timeout 1800 --graceful-timeout 60

  # Full-system Excel export emailed to pkanoontutor@gmail.com.
  # Schedules are UTC; the site runs on Asia/Bangkok (UTC+7), so 23:59 local
  # is 16:59 UTC the same day.
  #   Sunday 23:59 ICT -> "59 16 * * 0"
  #   Friday 23:59 ICT -> "59 16 * * 5"
  - type: cron
    name: pkanoontutor-export-sunday
    env: python
    pythonVersion: 3.12.8
    schedule: "59 16 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py email_full_export

  - type: cron
    name: pkanoontutor-export-friday
    env: python
    pythonVersion: 3.12.8
    schedule: "59 16 * * 5"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py email_full_export
